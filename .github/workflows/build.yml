name: build

on:
  push:
    branches: ['**']     # not tags: a release push used to run everything twice
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl1.2-dev libopenmpt-dev lrzsz
      - name: Build
        run: make
      - name: Regression tests
        run: make test

  # The same suites under AddressSanitizer + UBSan, plus the disk-image fuzzer.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl1.2-dev libopenmpt-dev lrzsz
      - name: Tests under ASan/UBSan
        run: make test-asan
      - name: Disk image fuzzer
        run: make fuzz

  # The 32-bit package that is actually released (scripts/cross-compile-win.sh),
  # not just the 64-bit MSYS2 build below.
  windows-release-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 zip rsync
      - name: Cross-compile the release package
        run: bash scripts/cross-compile-win.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl12-compat libopenmpt lrzsz
      - name: Build
        run: make
      - name: Regression tests
        run: make test

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_mixer
            mingw-w64-x86_64-pkg-config
      - name: Build
        run: mingw32-make
